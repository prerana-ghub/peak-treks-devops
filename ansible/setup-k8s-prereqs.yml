---
- name: Prepare server for Kubernetes (kubeadm)
  hosts: k8s-server
  become: true

  tasks:
    - name: Turn swap off now
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Keep swap off after a reboot
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Load kernel modules at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: "0644"

    - name: Load kernel modules now
      ansible.builtin.command: modprobe {{ item }}
      loop:
        - overlay
        - br_netfilter
      changed_when: false

    - name: Set kernel network settings for Kubernetes
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
        mode: "0644"
      notify: Apply sysctl settings

    - name: Install packages needed to add the Kubernetes repository
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
        state: present
        update_cache: true

    - name: Make sure the apt keyrings folder exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download the Kubernetes repository key
      ansible.builtin.shell: curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add the Kubernetes repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.34/deb/ /"
        filename: kubernetes
        state: present

    - name: Install containerd, kubelet, kubeadm and kubectl
      ansible.builtin.apt:
        name:
          - containerd
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Stop automatic upgrades of the Kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Make sure the containerd config folder exists
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: Check whether containerd already uses the systemd cgroup driver
      ansible.builtin.command: grep -q "SystemdCgroup = true" /etc/containerd/config.toml
      register: cgroup_check
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Write the default containerd config
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      when: cgroup_check.rc != 0
      notify: Restart containerd

    - name: Switch containerd to the systemd cgroup driver
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: Restart containerd

    - name: Start and enable containerd
      ansible.builtin.systemd:
        name: containerd
        state: started
        enabled: true

    - name: Enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true

  handlers:
    - name: Apply sysctl settings
      ansible.builtin.command: sysctl --system

    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted