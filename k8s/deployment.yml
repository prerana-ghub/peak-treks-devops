apiVersion: apps/v1
kind: Deployment
metadata:
  name: peak
spec:
  selector:
    matchLabels:
      app: peak
  template:
    metadata:
      labels:
        app: peak
    spec:
      containers:
      - name: peak
        image: preranasseshadri/peak:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        envFrom:
        - secretRef:
            name: peak-secrets
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi